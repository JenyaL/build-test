name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Validate BUILD_RESULT
        env:
          BUILD_RESULT: ${{ secrets.BUILD_RESULT }}
        run: |
          if [ -z "${BUILD_RESULT}" ]; then
            echo "BUILD_RESULT is empty (forked PR or misconfig)."
            exit 1
          else
            echo "BUILD_RESULT is set."
          fi

      - name: Run build
        env:
          BUILD_RESULT: ${{ secrets.BUILD_RESULT }}
        run: npm run build
