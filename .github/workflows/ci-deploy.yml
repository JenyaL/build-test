name: CI + Deploy (prebuilt)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG:   ${{ secrets.VERCEL_ORG_ID }}

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    outputs:
      is_pr: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install
        run: |
          npm ci || npm install

      - name: Lint
        run: |
          if npm run | grep -q " lint"; then npm run lint; else echo "No lint script"; fi

      - name: Unit tests
        run: |
          if npm run | grep -q " test"; then npm test --ci --passWithNoTests=false; else echo "No test script"; fi

      - name: E2E tests (optional)
        run: |
          if npm run | grep -q " e2e"; then npm run e2e; else echo "No e2e script"; fi

      - name: App build
        run: npm run build

      - name: Build summary
        run: echo "Build & tests passed ✅" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build_and_test
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Decide target
        id: tgt
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "target=preview" >> $GITHUB_OUTPUT
          else
            echo "target=production" >> $GITHUB_OUTPUT
          fi

      - name: Pull Vercel project settings
        run: |
          vercel pull --yes \
            --environment "${{ steps.tgt.outputs.target }}" \
            --token "${{ env.VERCEL_TOKEN }}" \
            --scope "${{ env.VERCEL_ORG }}"

      - name: Vercel prebuild
        run: |
          vercel build \
            --token "${{ env.VERCEL_TOKEN }}" \
            --scope "${{ env.VERCEL_ORG }}"

      - name: Deploy (prebuilt)
        id: deploy
        env:
          VC_TOKEN: ${{ env.VERCEL_TOKEN }}
          VC_TEAM:  ${{ env.VERCEL_ORG }}
          TARGET:   ${{ steps.tgt.outputs.target }}
        run: |
          set -e
          ARGS=(deploy --yes --token "$VC_TOKEN" --scope "$VC_TEAM" --prebuilt)
          if [ "$TARGET" = "production" ]; then
            ARGS+=(--prod)
          fi
          URL="$(vercel "${ARGS[@]}")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Summary
        run: |
          echo "### Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: **${{ steps.tgt.outputs.target }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          
          
          - name: Post Preview URL to PR
            if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.url != '' }}
            uses: actions/github-script@v7
            with:
              script: |
                const url = process.env.URL || '${{ steps.deploy.outputs.url }}';
                const pr = context.payload.pull_request.number;
                const commit = context.payload.pull_request.head.sha.slice(0, 7);
                const message = `✅ **Preview ready for commit \`${commit}\`**\n🔗 ${url}`;
                await github.rest.issues.createComment({
                  issue_number: pr,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: message
                });
            env:
              URL: ${{ steps.deploy.outputs.url }}

      - name: Post Preview URL to PR
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.URL || '${{ steps.deploy.outputs.url }}';
            const pr = context.payload.pull_request.number;
            const commit = context.payload.pull_request.head.sha.slice(0, 7);
            const message = `✅ **Preview ready for commit \`${commit}\`**\n🔗 ${url}`;
            await github.rest.issues.createComment({
              issue_number: pr,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
        env:
          URL: ${{ steps.deploy.outputs.url }}