name: CI + Deploy (prebuilt)

on:
  push:
    branches: [ '**' ]       # prod only for main; others -> preview
  pull_request:
    branches: [ main ]       # PRs into main get preview link

permissions:
  contents: read
  issues: write
  pull-requests: write
  deployments: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG:   ${{ secrets.VERCEL_ORG_ID }}

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install
        run: npm ci || npm install
      - name: Lint
        run: npm run -s | grep -qE '(^| )lint( |:)' && npm run lint || echo "No lint script"
      - name: Unit tests
        run: npm run -s | grep -qE '(^| )test( |:)' && npm test --ci --passWithNoTests=false || echo "No test script"
      - name: E2E tests (optional)
        run: npm run -s | grep -qE '(^| )e2e( |:)' && npm run e2e || echo "No e2e script"
      - name: App build
        run: npm run build
      - name: Build summary
        run: echo "Build & tests passed ✅" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build_and_test
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      # PR conflict notice (comment)
      - name: Warn if conflicts detected
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.mergeable == false }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: "⚠️ **Merge conflict detected!**\nPlease resolve conflicts before merging."
            })

      # PR conflict → fail checks (stops deploy)
      - name: Fail if conflicts detected
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.mergeable == false }}
        run: |
          echo "::error title=Merge conflict detected::Please resolve conflicts before merging."
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Decide target
        id: tgt
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "target=preview" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=production" >> $GITHUB_OUTPUT
          else
            echo "target=preview" >> $GITHUB_OUTPUT
          fi

      - name: Pull Vercel project settings
        run: |
          vercel pull --yes \
            --environment "${{ steps.tgt.outputs.target }}" \
            --token "${{ env.VERCEL_TOKEN }}" \
            --scope "${{ env.VERCEL_ORG }}"

      - name: Vercel prebuild
        run: |
          vercel build \
            --token "${{ env.VERCEL_TOKEN }}" \
            --scope "${{ env.VERCEL_ORG }}"

      - name: Deploy (prebuilt)
        id: deploy
        env:
          VC_TOKEN: ${{ env.VERCEL_TOKEN }}
          VC_TEAM:  ${{ env.VERCEL_ORG }}
          TARGET:   ${{ steps.tgt.outputs.target }}
        run: |
          set -e
          ARGS=(deploy --yes --token "$VC_TOKEN" --scope "$VC_TEAM" --prebuilt)
          [ "$TARGET" = "production" ] && ARGS+=(--prod) || true
          URL="$(vercel "${ARGS[@]}")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Summary
        run: |
          echo "### Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: **${{ steps.tgt.outputs.target }}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.tgt.outputs.target }}" = "production" ]; then
            echo "- URL: (hidden for production)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Post Preview URL to PR
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: `✅ Preview ready: ${{ steps.deploy.outputs.url }}`
            })

      - name: Link deployment to commit
        if: ${{ github.event_name == 'push' && steps.deploy.outputs.url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const isProd = (context.ref === 'refs/heads/main');
            const envName = isProd ? 'production' : context.ref.replace('refs/heads/', '');
            const { data: dep } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.sha,
              environment: envName,
              auto_merge: false,
              required_contexts: []
            });
            const status = {
              ...context.repo,
              deployment_id: dep.id,
              state: 'success',
              environment: envName
            };
            if (!isProd) status.environment_url = '${{ steps.deploy.outputs.url }}';
            await github.rest.repos.createDeploymentStatus(status);