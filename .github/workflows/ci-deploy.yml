Here’s your optimized YAML with short English comments only — just describing each step, no explanations or extra notes:

name: CI + Deploy (prebuilt)

on:
  push:
    branches: ['**']       # prod only for main; others -> preview
  pull_request:
    branches: [ main ]     # PRs into main get preview link

permissions:
  contents: read
  issues: write
  pull-requests: write
  deployments: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG:   ${{ secrets.VERCEL_ORG_ID }}

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Setup Node.js and npm cache
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci || npm install

      # Run lint
      - name: Run lint (if exists)
        run: npm run -s | grep -qE '(^| )lint( |:)' && npm run lint || echo "No lint script"

      # Run unit tests
      - name: Run unit tests (if exists)
        run: npm run -s | grep -qE '(^| )test( |:)' && npm test --ci --passWithNoTests=false || echo "No test script"

      # Run e2e tests
      - name: Run e2e tests (if exists)
        run: npm run -s | grep -qE '(^| )e2e( |:)' && npm run e2e || echo "No e2e script"

      # Build project
      - name: Build project
        run: npm run build

      # Add build summary
      - name: Build summary
        run: echo "✅ Build & tests passed" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build_and_test
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # Install Vercel CLI
      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Decide deploy target
      - name: Decide deploy target
        id: tgt
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=production" >> $GITHUB_OUTPUT
          else
            echo "target=preview" >> $GITHUB_OUTPUT
          fi

      # Pull project settings
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment "${{ steps.tgt.outputs.target }}" \
          --token "${{ env.VERCEL_TOKEN }}" --scope "${{ env.VERCEL_ORG }}"

      # Build project output
      - name: Build prebuilt output
        run: vercel build --token "${{ env.VERCEL_TOKEN }}" --scope "${{ env.VERCEL_ORG }}"

      # Deploy prebuilt output
      - name: Deploy prebuilt
        id: deploy
        run: |
          ARGS=(deploy --yes --token "${{ env.VERCEL_TOKEN }}" --scope "${{ env.VERCEL_ORG }}" --prebuilt)
          [ "${{ steps.tgt.outputs.target }}" = "production" ] && ARGS+=(--prod)
          URL=$(vercel "${ARGS[@]}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "✅ Deployed: $URL"

      # Add deployment summary
      - name: Deployment summary
        run: |
          echo "### Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: **${{ steps.tgt.outputs.target }}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.tgt.outputs.target }}" = "production" ]; then
            echo "- URL: (hidden for production)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Post preview comment
      - name: Comment preview on PR
        if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: `✅ Preview ready: ${{ steps.deploy.outputs.url }}`
            })

      # Create GitHub deployment card
      - name: Create GitHub Deployment
        if: ${{ github.event_name == 'push' && steps.deploy.outputs.url != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const isProd = (context.ref === 'refs/heads/main');
            const envName = isProd ? 'production' : context.ref.replace('refs/heads/', '');

            const { data: dep } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: context.sha,
              environment: envName,
              auto_merge: false,
              required_contexts: []
            });

            const status = {
              ...context.repo,
              deployment_id: dep.id,
              state: 'success',
              environment: envName
            };

            if (!isProd) status.environment_url = '${{ steps.deploy.outputs.url }}';
            await github.rest.repos.createDeploymentStatus(status);