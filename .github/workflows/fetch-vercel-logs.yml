name: Fetch Vercel Logs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (e.g. 8)"
        required: false
      sha:
        description: "Head commit SHA of PR (overrides PR)"
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN:   ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG:     ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - uses: actions/checkout@v4

      # Step 1: resolve PR number and SHA
      - name: Resolve PR & SHA
        id: ctx
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const inputPr  = core.getInput('pr');
            const inputSha = core.getInput('sha');

            let pr  = null;
            let sha = null;

            if (inputSha) sha = inputSha;
            if (inputPr)  pr  = Number(inputPr);

            if (!sha || !pr) {
              if (context.eventName === 'pull_request') {
                pr  = pr  ?? context.payload.pull_request.number;
                sha = sha ?? context.payload.pull_request.head.sha;
              } else if (context.eventName === 'check_run') {
                const cr = context.payload.check_run;
                sha = sha ?? cr.head_sha;
                if (!pr && sha) {
                  const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                    owner, repo, commit_sha: sha
                  });
                  pr = prs.data[0]?.number || null;
                }
              }
            }

            if (!pr) {
              const prs = await github.rest.pulls.list({
                owner, repo, state: 'open', per_page: 1, sort: 'updated', direction: 'desc'
              });
              pr = prs.data[0]?.number || null;
            }
            if (!sha && pr) {
              const prInfo = await github.rest.pulls.get({ owner, repo, pull_number: pr });
              sha = prInfo.data.head.sha;
            }

            core.info(`Resolved -> PR: ${pr || '(none)'} | SHA: ${sha || '(none)'}`);
            core.setOutput('pr',  pr  ? String(pr) : '');
            core.setOutput('sha', sha ? String(sha) : '');

      # Step 2: find deployment
      - name: Find Vercel deployment
        id: dep
        run: |
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT&target=preview&limit=50" \
            > deployments.json

          DEP_ID=$(jq -r --arg PR "${{ steps.ctx.outputs.pr }}" '.deployments[] | select(.meta.githubPrId == $PR) | .uid' deployments.json | head -n1)
          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            DEP_ID=$(jq -r --arg SHA "${{ steps.ctx.outputs.sha }}" '.deployments[] | select(.meta.githubCommitSha == $SHA) | .uid' deployments.json | head -n1)
          fi
          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            DEP_ID=$(jq -r '.deployments[0].uid' deployments.json)
          fi
          echo "id=$DEP_ID" >> $GITHUB_OUTPUT

      # Step 3: fetch logs (events or builds)
      - name: Fetch Vercel logs
        id: logs
        run: |
          DEPLOY_ID=${{ steps.dep.outputs.id }}
          echo "Deployment: $DEPLOY_ID"

          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/deployments/$DEPLOY_ID/events?orgId=$VERCEL_ORG&limit=1000" \
            -o vercel-events.json || true

          if jq -e '.events | length > 0' vercel-events.json >/dev/null 2>&1; then
            SRC="vercel-events.json"
          else
            curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v2/deployments/$DEPLOY_ID/builds?orgId=$VERCEL_ORG" \
              -o vercel-builds.json || true
            BUILD_ID=$(jq -r '.builds[0].id // empty' vercel-builds.json)
            if [ -n "$BUILD_ID" ]; then
              curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v2/deployments/$DEPLOY_ID/builds/$BUILD_ID/events?orgId=$VERCEL_ORG&limit=1000" \
                -o vercel-build-events.json || true
              SRC="vercel-build-events.json"
            fi
          fi

          jq -r '
            ( .events // [] )
            | .[]
            | ( .payload? // .entry? // . )
            | ( .text?, .message?, .error?, .error?.message?, (.entries? // [])[]?, (.logs? // [])[]? )
            | strings
          ' "$SRC" > vercel-build.log 2>/dev/null || true

          if [ ! -s vercel-build.log ]; then
            echo "[empty logs]" > vercel-build.log
          fi

      # Step 4: prepare markdown
      - name: Prepare markdown
        id: md
        run: |
          TAIL_LINES=200
          tail -n ${TAIL_LINES} vercel-build.log > tail.txt || true

          {
            echo "<!-- vercel-logs-anchor -->"
            echo "❌ Vercel deployment \`${{ steps.dep.outputs.id }}\` failed."
            echo
            echo "**Last ${TAIL_LINES} lines:**"
            echo
            echo '```'
            cat tail.txt
            echo '```'
          } > comment.md

          {
            echo "### Vercel Logs (last ${TAIL_LINES} lines)"
            echo
            echo '```'
            cat tail.txt
            echo '```'
          } > summary.md

      # Step 5: comment into PR
      - name: Post/Update PR comment
        if: ${{ steps.ctx.outputs.pr != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.ctx.outputs.pr }}
          body-file: comment.md
          edit-mode: replace
          search: '<!-- vercel-logs-anchor -->'

      # Step 6: publish to Checks tab
      - name: Publish check run (Vercel Logs)
        if: ${{ steps.ctx.outputs.sha != '' }}
        uses: LouisBrunner/checks-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sha: ${{ steps.ctx.outputs.sha }}
          name: Vercel Logs
          conclusion: failure
          output: |
            {"title":"Vercel Logs","summary":"See details below","text":"```\n$(cat summary.md)\n```"}

      # Step 7: upload artifacts
      - name: Upload raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-raw
          path: |
            vercel-events.json
            vercel-builds.json
            vercel-build-events.json
            vercel-build.log