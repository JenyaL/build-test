name: Fetch Vercel Logs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (optional)"
        required: false
      sha:
        description: "Commit SHA (optional)"
        required: false
      deployment_id:
        description: "Vercel deployment UID (dpl_*, optional)"
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN:   ${{ secrets.VERCEL_TOKEN }}     # personal token from Vercel
      VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}# prj_...
      VERCEL_ORG:     ${{ secrets.VERCEL_ORG_ID }}    # team_...

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      # 1) PR + SHA
      - name: Resolve PR & SHA
        id: ctx
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pr=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "sha=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          [ -n "${{ github.event.inputs.sha }}" ] && echo "sha=${{ github.event.inputs.sha }}" >> $GITHUB_OUTPUT
          [ -n "${{ github.event.inputs.pr }}" ]  && echo "pr=${{ github.event.inputs.pr }}"   >> $GITHUB_OUTPUT

      # 2) Если руками передали deployment_id — используем его
      - name: Take manual deployment_id if provided
        id: dpl_input
        run: |
          if [ -n "${{ github.event.inputs.deployment_id }}" ]; then
            echo "id=${{ github.event.inputs.deployment_id }}" >> $GITHUB_OUTPUT
          fi

      # 3) Пытаемся вытащить dpl_* из GitHub Checks (Vercel)
      - name: Try read Vercel check run
        id: from_checks
        if: ${{ steps.dpl_input.outputs.id == '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.ctx.outputs.sha || github.sha }}';
            const {owner, repo} = context.repo;
            const runs = await github.rest.checks.listForRef({owner, repo, ref: sha, per_page: 100});
            const vr = runs.data.check_runs.find(r =>
              (r.app?.slug?.toLowerCase() === 'vercel') || (r.name||'').toLowerCase().includes('vercel')
            );
            let depId = '', host = '';
            if (vr?.details_url) {
              const m = vr.details_url.match(/dpl_[A-Za-z0-9]+/);
              if (m) depId = m[0];
              const m2 = vr.details_url.match(/https?:\/\/([^\/\s]+\.vercel\.app)/);
              if (m2) host = m2[1];
            }
            core.setOutput('id', depId);
            core.setOutput('host', host);

      # 4) Если нет id, но есть host превью — найдём деплой по url через API
      - name: Resolve by preview URL
        id: by_url
        if: ${{ steps.dpl_input.outputs.id == '' && steps.from_checks.outputs.id == '' && steps.from_checks.outputs.host != '' }}
        shell: bash
        run: |
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT&target=preview&limit=50" > deployments.json
          DEP_ID=$(jq -r --arg H "${{ steps.from_checks.outputs.host }}" '.deployments[] | select(.url == $H) | .uid' deployments.json | head -n1)
          [ -n "$DEP_ID" ] && echo "id=$DEP_ID" >> $GITHUB_OUTPUT || true

      # 5) Фоллбек: PR → SHA → последний preview
      - name: Fallback find deployment
        id: dep_fallback
        if: ${{ steps.dpl_input.outputs.id == '' && steps.from_checks.outputs.id == '' && steps.by_url.outputs.id == '' }}
        shell: bash
        run: |
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT&target=preview&limit=50" > deployments.json
          DEP_ID=$(jq -r --arg PR "${{ steps.ctx.outputs.pr }}" '.deployments[] | select(.meta.githubPrId == $PR) | .uid' deployments.json | head -n1)
          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            DEP_ID=$(jq -r --arg SHA "${{ steps.ctx.outputs.sha || github.sha }}" '.deployments[] | select(.meta.githubCommitSha == $SHA) | .uid' deployments.json | head -n1)
          fi
          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            DEP_ID=$(jq -r '.deployments[0].uid' deployments.json)
          fi
          [ -n "$DEP_ID" ] && [ "$DEP_ID" != "null" ] || { echo "No deployment found"; exit 1; }
          echo "id=$DEP_ID" >> $GITHUB_OUTPUT

      # 6) Выбираем итоговый id
      - name: Select deployment id
        id: sel
        run: |
          echo "id=${{ steps.dpl_input.outputs.id || steps.from_checks.outputs.id || steps.by_url.outputs.id || steps.dep_fallback.outputs.id }}" >> $GITHUB_OUTPUT

      # 7) Тянем события
      - name: Fetch Vercel events
        id: ev
        shell: bash
        run: |
          DEP="${{ steps.sel.outputs.id }}"
          echo "Using deployment: $DEP"
          URL="https://api.vercel.com/v2/deployments/${DEP}/events?teamId=${{ env.VERCEL_ORG }}&limit=1000"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "$URL" > vercel-events.json
          echo "Events size: $(wc -c < vercel-events.json)"

      # 8) Парсим в плейнтекст
      - name: Parse logs
        id: logs
        shell: bash
        run: |
          jq -r '
            def evs: if type=="array" then . elif has("events") then .events else [] end;
            evs | .[] | ( .payload? // .entry? // . )
            | ( .text?, .message?, .error?, .error?.message?, (.entries? // [])[]?, (.logs? // [])[]? )
            | strings
          ' vercel-events.json > vercel-build.log || true
          if [ -s vercel-build.log ]; then
            tail -n 200 vercel-build.log > tail.txt
          else
            echo "[no events text returned by Vercel API for this deployment]" > tail.txt
          fi

      # 9) Информация о деплое
      - name: Deployment info
        id: info
        shell: bash
        run: |
          DEP="${{ steps.sel.outputs.id }}"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${DEP}?teamId=${{ env.VERCEL_ORG }}" > vercel-deployment.json
          echo "url=$(jq -r '.url // empty' vercel-deployment.json)"   >> $GITHUB_OUTPUT
          echo "state=$(jq -r '.readyState // empty' vercel-deployment.json)" >> $GITHUB_OUTPUT

      # 10) Публикуем результат на вкладке Checks (как отдельный check run)
      - name: Publish Vercel Logs check
        if: ${{ steps.ctx.outputs.sha != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sha = '${{ steps.ctx.outputs.sha }}';
            const {owner, repo} = context.repo;
            const depId = '${{ steps.sel.outputs.id }}';
            const state = '${{ steps.info.outputs.state }}';
            const url = '${{ steps.info.outputs.url }}';
            const tail = fs.readFileSync('tail.txt','utf8');
            await github.rest.checks.create({
              owner, repo, head_sha: sha, name: 'Vercel Logs',
              status: 'completed',
              conclusion: (state === 'ERROR' ? 'failure' : 'neutral'),
              output: {
                title: `Vercel Logs (${state})`,
                summary: `Deployment: ${depId}\n${url ? `Preview: https://${url}\n` : ''}\n\nLast 200 lines:\n\n\`\`\`\n${tail}\n\`\`\``
              }
            });

      # 11) Добавляем/обновляем комментарий в PR (без устаревшего 'search')
      - name: Upsert PR comment with logs
        if: ${{ steps.ctx.outputs.pr != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const issue_number = Number('${{ steps.ctx.outputs.pr }}');
            const depId = '${{ steps.sel.outputs.id }}';
            const state = '${{ steps.info.outputs.state }}';
            const url = '${{ steps.info.outputs.url }}';
            const tail = fs.readFileSync('tail.txt','utf8');
            const anchor = '<!-- vercel-logs-anchor -->';
            const body = [
              anchor,
              `🔗 Deployment: \`${depId}\` — state: **${state}**`,
              url ? `\nPreview: https://${url}` : '',
              '',
              'Tail (200 lines):',
              '```',
              tail,
              '```'
            ].join('\n');
            // ищем существующий наш комментарий
            const {data: comments} = await github.rest.issues.listComments({owner, repo, issue_number, per_page: 100});
            const mine = comments.find(c => (c.user?.type === 'Bot') && c.body?.includes(anchor));
            if (mine) {
              await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }

      - name: Upload raw (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-raw
          path: |
            vercel-events.json
            vercel-deployment.json
            vercel-build.log
            tail.txt