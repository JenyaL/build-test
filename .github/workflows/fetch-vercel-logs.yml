name: Fetch Vercel Logs (PR + auto on any Vercel check)

on:
  # Run on PR activity
  pull_request:
    types: [opened, synchronize, reopened]
  # Run whenever a Vercel check finishes (covers manual Redeploy from Vercel UI)
  check_run:
    types: [completed]
  # Manual: refetch by PR, SHA or by explicit deployment id (dpl_...)
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (e.g. 8)"
        required: false
      sha:
        description: "Head commit SHA (overrides PR)"
        required: false
      deployment:
        description: "Explicit Vercel deployment id (dpl_...)"
        required: false
      redeploy:
        description: "Trigger Vercel Deploy Hook first (yes/no)"
        required: false
        default: "no"

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  fetch:
    # Run on PR, manual, or when a Vercel check completed
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'check_run' &&
       (contains(github.event.check_run.name, 'Vercel') ||
        contains(github.event.check_run.app.slug, 'vercel')))
    runs-on: ubuntu-latest
    env:
      # Set in repo Settings → Secrets and variables → Actions
      VERCEL_TOKEN:   ${{ secrets.VERCEL_TOKEN }}       # personal token
      VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}  # prj_...
      VERCEL_ORG:     ${{ secrets.VERCEL_ORG_ID }}      # team_...
      # Optional: Vercel Deploy Hook URL to trigger a redeploy w/o commit
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure jq is installed
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      # (Optional) Redeploy from GitHub before fetching logs
      - name: Optional redeploy via Vercel Deploy Hook
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.redeploy == 'yes' && env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: |
          echo "Triggering Vercel Deploy Hook..."
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK_URL" -o /dev/null
          echo "Redeploy requested. Waiting ~15s so Vercel posts a fresh check..."
          sleep 15

      # Resolve PR / SHA (priority: inputs → event → latest open PR)
      - name: Resolve PR & SHA
        id: ctx
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const inputPr  = core.getInput('pr');
            const inputSha = core.getInput('sha');
            let pr  = inputPr  ? Number(inputPr) : null;
            let sha = inputSha || null;

            if (context.eventName === 'pull_request') {
              pr  = pr  ?? context.payload.pull_request.number;
              sha = sha ?? context.payload.pull_request.head.sha;
            } else if (context.eventName === 'check_run') {
              const cr = context.payload.check_run;
              sha = sha ?? cr.head_sha;
              if (!pr && sha) {
                const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
                pr = prs.data[0]?.number || null;
              }
            }

            if (!pr) {
              const prs = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 1, sort: 'updated', direction: 'desc' });
              pr = prs.data[0]?.number || null;
            }
            if (!sha && pr) {
              const prInfo = await github.rest.pulls.get({ owner, repo, pull_number: pr });
              sha = prInfo.data.head.sha;
            }

            core.info(`Resolved → PR: ${pr || '(none)'} | SHA: ${sha || '(none)'}`);
            core.setOutput('pr',  pr  ? String(pr) : '');
            core.setOutput('sha', sha ? String(sha) : '');

      # Try to get deployment id directly:
      #  1) workflow_dispatch input "deployment"
      #  2) parse from Vercel check details_url
      - name: Seed deployment from inputs/check_run
        id: seed
        uses: actions/github-script@v7
        with:
          script: |
            let depId = core.getInput('deployment') || '';
            let host = '';
            if (!depId && context.eventName === 'check_run') {
              const url = context.payload.check_run?.details_url || '';
              if (url) {
                const m1 = url.match(/dpl_[A-Za-z0-9]+/);
                if (m1) depId = m1[0];
                const m2 = url.match(/https?:\/\/([^\/\s]+\.vercel\.app)/i);
                if (m2) host = m2[1];
              }
            }
            core.setOutput('id', depId);
            core.setOutput('host', host);

      # If no id yet — try by PR (meta.githubPrId) then by preview host
      - name: Find deployment by PR/host
        id: dep
        run: |
          if [ -n "${{ steps.seed.outputs.id }}" ]; then
            echo "id=${{ steps.seed.outputs.id }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT&target=preview&limit=50" > deployments.json

          # Match by PR number first
          PR="${{ steps.ctx.outputs.pr }}"
          if [ -n "$PR" ]; then
            DEP_ID=$(jq -r --arg PR "$PR" '.deployments[] | select(.meta.githubPrId == $PR) | .uid' deployments.json | head -n1)
          fi

          # If still empty, try to match by preview host (from check_run)
          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            HOST="${{ steps.seed.outputs.host }}"
            if [ -n "$HOST" ]; then
              DEP_ID=$(jq -r --arg HN "$HOST" '.deployments[] | select(.url == $HN) | .uid' deployments.json | head -n1)
            fi
          fi

          # As a last resort, pick the latest preview deployment
          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            DEP_ID=$(jq -r '.deployments[0].uid' deployments.json)
          fi

          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            echo "No deployment id found"; exit 1
          fi

          echo "id=$DEP_ID" >> $GITHUB_OUTPUT

      - name: Fetch deployment events
        id: ev
        run: |
          DEP="${{ steps.dep.outputs.id || steps.seed.outputs.id }}"
          EV_URL="https://api.vercel.com/v2/deployments/${DEP}/events?teamId=${{ env.VERCEL_ORG }}&limit=1000"
          echo "GET $EV_URL"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "$EV_URL" > vercel-events.json
          echo "Events size: $(wc -c < vercel-events.json)"

      - name: Parse logs to plaintext
        id: logs
        run: |
          jq -r '
            def evs:
              if type=="array" then .
              elif has("events") then .events
              else [] end;
            evs
            | .[]
            | ( .payload? // .entry? // . )
            | ( .text?, .message?, .error?, .error?.message?, (.entries? // [])[]?, (.logs? // [])[]? )
            | strings
          ' vercel-events.json > vercel-build.log || true

          if [ -s vercel-build.log ]; then
            tail -n 200 vercel-build.log > tail.txt
            head -c 60000 vercel-build.log > full_truncated.txt
          else
            echo "[no events text returned by Vercel API]" > tail.txt
            cp tail.txt full_truncated.txt
          fi

      - name: Deployment info
        id: info
        run: |
          DEP="${{ steps.dep.outputs.id || steps.seed.outputs.id }}"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${DEP}?teamId=${{ env.VERCEL_ORG }}" > vercel-deployment.json
          echo "url=$(jq -r '.url // empty' vercel-deployment.json)"   >> $GITHUB_OUTPUT
          echo "state=$(jq -r '.readyState // empty' vercel-deployment.json)" >> $GITHUB_OUTPUT

      - name: Add job summary (tail 200)
        run: |
          ICON="✅"; [ "${{ steps.info.outputs.state }}" = "ERROR" ] && ICON="❌"
          echo "### ${ICON} Vercel Logs (tail 200)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.info.outputs.url }}" ]; then
            echo "Preview: https://${{ steps.info.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat tail.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish check run (Vercel Logs)
        if: ${{ steps.ctx.outputs.sha != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const sha  = '${{ steps.ctx.outputs.sha }}';
            const dep  = '${{ steps.dep.outputs.id || steps.seed.outputs.id }}';
            const state= '${{ steps.info.outputs.state }}';
            const url  = '${{ steps.info.outputs.url }}';
            const tail = fs.readFileSync('tail.txt','utf8');
            const isFail = state === 'ERROR';

            await github.rest.checks.create({
              owner, repo,
              name: 'Vercel Logs',
              head_sha: sha,
              status: 'completed',
              conclusion: isFail ? 'failure' : 'success',
              output: {
                title: `Vercel Logs (${state || 'unknown'})`,
                summary: `Deployment: ${dep}\n${url ? `Preview: https://${url}\n` : ''}\n\nLast 200 lines:\n\n\`\`\`\n${tail}\n\`\`\``
              }
            });

      - name: Build PR comment (tail + collapsible full)
        if: ${{ steps.ctx.outputs.pr != '' }}
        run: |
          ICON="✅"; [ "${{ steps.info.outputs.state }}" = "ERROR" ] && ICON="❌"
          {
            echo "${ICON} Deployment: \`${{ steps.dep.outputs.id || steps.seed.outputs.id }}\` — state: **${{ steps.info.outputs.state }}**"
            if [ -n "${{ steps.info.outputs.url }}" ]; then
              echo
              echo "Preview: https://${{ steps.info.outputs.url }}"
            fi
            echo
            echo "**Tail (200 lines):**"
            echo
            echo '```'
            cat tail.txt
            echo '```'
            echo
            echo "<details><summary>Show full log (truncated)</summary>"
            echo
            echo '```'
            cat full_truncated.txt
            echo '```'
            echo
            echo "</details>"
          } > comment.md

      - name: Comment to PR
        if: ${{ steps.ctx.outputs.pr != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.ctx.outputs.pr }}
          body-file: comment.md

      # Mark the Actions job red if Vercel says ERROR (so Checks tab isn't green)
      - name: Fail job if Vercel ERROR
        if: ${{ steps.info.outputs.state == 'ERROR' }}
        run: |
          echo "Vercel state is ERROR — failing this job to reflect the error in Checks."
          exit 1

      - name: Upload raw (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-raw
          path: |
            vercel-events.json
            vercel-deployment.json
            vercel-build.log
            tail.txt
            full_truncated.txt