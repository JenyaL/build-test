name: Fetch Vercel Logs

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull Request number (optional)"
        required: false
      sha:
        description: "Commit SHA (optional, overrides PR if set)"
        required: false
      deployment_id:
        description: "Vercel deployment UID (dpl_*) — overrides PR/SHA"
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN:   ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG:     ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - uses: actions/checkout@v4

      # === Resolve PR and SHA ===
      - name: Resolve PR number and SHA
        id: ctx
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_INPUT="${{ github.event.inputs.pr }}"
          SHA_INPUT="${{ github.event.inputs.sha }}"
          if [ -n "$SHA_INPUT" ]; then
            echo "sha=$SHA_INPUT" >> $GITHUB_OUTPUT
          else
            if [ -n "$PR_INPUT" ]; then
              SHA=$(gh pr view "$PR_INPUT" --json headRefOid --jq .headRefOid)
              echo "sha=$SHA" >> $GITHUB_OUTPUT
              echo "pr=$PR_INPUT" >> $GITHUB_OUTPUT
            else
              PR=$(gh pr list --search "${{ github.sha }}" --json number --jq '.[0].number' || true)
              if [ -n "$PR" ] && [ "$PR" != "null" ]; then
                SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
                echo "pr=$PR"  >> $GITHUB_OUTPUT
                echo "sha=$SHA" >> $GITHUB_OUTPUT
              else
                echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      # === Use provided deployment_id ===
      - name: Use provided deployment_id if any
        id: dpl_input
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.deployment_id }}" ]; then
            echo "id=${{ github.event.inputs.deployment_id }}" >> $GITHUB_OUTPUT
          fi

      # === Find deployment if no manual ID ===
      - name: Find Vercel deployment
        id: dep
        shell: bash
        run: |
          set -e
          if [ -n "${{ steps.dpl_input.outputs.id }}" ]; then
            echo "id=${{ steps.dpl_input.outputs.id }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT&target=preview&limit=50" \
            > deployments.json

          DEP_ID=$(jq -r --arg PR "${{ steps.ctx.outputs.pr }}" \
            '.deployments[] | select(.meta.githubPrId == $PR) | .uid' deployments.json | head -n1)
          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            DEP_ID=$(jq -r --arg SHA "${{ steps.ctx.outputs.sha }}" \
              '.deployments[] | select(.meta.githubCommitSha == $SHA) | .uid' deployments.json | head -n1)
          fi
          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            DEP_ID=$(jq -r '.deployments[0].uid' deployments.json)
          fi
          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            echo "No deployment found"; exit 1
          fi
          echo "id=$DEP_ID" >> $GITHUB_OUTPUT

      # === Fetch deployment events ===
      - name: Fetch deployment events
        shell: bash
        run: |
          URL="https://api.vercel.com/v2/deployments/${{ steps.dep.outputs.id }}/events?teamId=$VERCEL_ORG&limit=1000"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "$URL" > vercel-events.json

      # === Parse logs (array or {events:[]}) ===
      - name: Parse logs
        id: logs
        shell: bash
        run: |
          jq -r '
            def evs:
              if type=="array" then .
              elif has("events") then .events
              else [] end;
            evs
            | .[]
            | ( .payload? // .entry? // . )
            | ( .text?, .message?, .error?, .error?.message?, (.entries? // [])[]?, (.logs? // [])[]? )
            | strings
          ' vercel-events.json > vercel-build.log || true

          if [ -s vercel-build.log ]; then
            echo "has_text=true" >> $GITHUB_OUTPUT
          fi

      # === Deployment info (URL & state) ===
      - name: Deployment info
        id: info
        shell: bash
        run: |
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${{ steps.dep.outputs.id }}?teamId=$VERCEL_ORG" \
            > vercel-deployment.json
          echo "url=$(jq -r '.url' vercel-deployment.json)" >> $GITHUB_OUTPUT
          echo "state=$(jq -r '.readyState' vercel-deployment.json)" >> $GITHUB_OUTPUT

      # === Prepare markdown ===
      - name: Prepare markdown
        id: md
        shell: bash
        run: |
          TAIL_LINES=200
          if [ -s vercel-build.log ]; then
            tail -n ${TAIL_LINES} vercel-build.log > tail.txt
          else
            echo "[no events text returned by Vercel API]" > tail.txt
          fi

          DEP_ID="${{ steps.dep.outputs.id }}"
          DEP_URL="${{ steps.info.outputs.url }}"
          STATE="${{ steps.info.outputs.state }}"

          {
            echo "<!-- vercel-logs-anchor -->"
            echo "🔗 Deployment: \`$DEP_ID\` — state: **$STATE**"
            if [ -n "$DEP_URL" ]; then
              echo
              echo "Preview URL: https://$DEP_URL"
            fi
            echo
            echo "**Tail (${TAIL_LINES} lines):**"
            echo
            echo '```'
            cat tail.txt
            echo '```'
          } > comment.md

          {
            echo "### Vercel Logs (tail ${TAIL_LINES})"
            echo
            echo '```'
            cat tail.txt
            echo '```'
          } > summary.md

      # === Add summary ===
      - name: Add summary to PR Checks
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # === Comment in PR ===
      - name: Post/Update PR comment
        if: ${{ steps.ctx.outputs.pr != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.ctx.outputs.pr }}
          body-file: comment.md
          edit-mode: replace
          search: '<!-- vercel-logs-anchor -->'
          reactions: eyes

      # === Upload raw JSON (debug) ===
      - name: Upload raw JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-raw
          path: |
            vercel-events.json
            vercel-deployment.json
            vercel-build.log
