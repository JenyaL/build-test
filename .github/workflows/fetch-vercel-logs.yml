name: Fetch Vercel Logs (PR + auto on failure)

on:
  # Runs on PR events
  pull_request:
    types: [opened, synchronize, reopened]
  # Auto-run when a Vercel check finishes -> if it failed, we fetch logs
  check_run:
    types: [completed]
  # Manual trigger with optional inputs
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (e.g. 8)"
        required: false
      sha:
        description: "Head commit SHA (overrides PR)"
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  fetch:
    # Run on PR OR when a failing Vercel check finishes
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'check_run' &&
       (contains(github.event.check_run.name, 'Vercel') ||
        contains(github.event.check_run.app.slug, 'vercel')) &&
       github.event.check_run.conclusion == 'failure') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Set these in: Settings → Secrets and variables → Actions
      VERCEL_TOKEN:   ${{ secrets.VERCEL_TOKEN }}       # Personal token
      VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}  # prj_...
      VERCEL_ORG:     ${{ secrets.VERCEL_ORG_ID }}      # team_...

    steps:
      # --- Keep the proven steps that were working ---

      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure jq installed
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      # Resolve PR & SHA (priority: manual inputs → event payload → latest open PR)
      - name: Resolve PR & SHA
        id: ctx
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;

            // 1) Inputs (manual run)
            const inputPr  = core.getInput('pr');
            const inputSha = core.getInput('sha');

            let pr  = inputPr  ? Number(inputPr) : null;
            let sha = inputSha || null;

            // 2) From event payload
            if (context.eventName === 'pull_request') {
              pr  = pr  ?? context.payload.pull_request.number;
              sha = sha ?? context.payload.pull_request.head.sha;
            } else if (context.eventName === 'check_run') {
              const cr = context.payload.check_run;
              sha = sha ?? cr.head_sha;
              if (!pr && sha) {
                const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
                pr = prs.data[0]?.number || null;
              }
            }

            // 3) Fallback: latest open PR
            if (!pr) {
              const prs = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 1, sort: 'updated', direction: 'desc' });
              pr = prs.data[0]?.number || null;
            }
            if (!sha && pr) {
              const prInfo = await github.rest.pulls.get({ owner, repo, pull_number: pr });
              sha = prInfo.data.head.sha;
            }

            core.info(`Resolved → PR: ${pr || '(none)'} | SHA: ${sha || '(none)'}`);
            core.setOutput('pr',  pr  ? String(pr) : '');
            core.setOutput('sha', sha ? String(sha) : '');

      # If we came from a Vercel check, try to get dpl_* (and preview host) from details_url
      - name: Try get deployment from Vercel check_run
        id: from_check
        if: ${{ github.event_name == 'check_run' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = context.payload.check_run?.details_url || '';
            let depId = '';
            let host = '';
            if (url) {
              const m1 = url.match(/dpl_[A-Za-z0-9]+/);
              if (m1) depId = m1[0];
              const m2 = url.match(/https?:\/\/([^\/\s]+\.vercel\.app)/i);
              if (m2) host = m2[1];
            }
            core.info(`details_url: ${url}`);
            core.setOutput('id',   depId);
            core.setOutput('host', host);

      # Fallback: find deployment by PR number (meta.githubPrId)
      - name: Fallback by PR (meta.githubPrId)
        id: dep_by_pr
        if: ${{ steps.from_check.outputs.id == '' }}
        run: |
          PR="${{ steps.ctx.outputs.pr }}"
          if [ -z "$PR" ]; then
            echo "No PR in context — skip PR lookup."
            exit 0
          fi
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT&target=preview&limit=50" > deployments.json
          DEP_ID=$(jq -r --arg PR "$PR" '.deployments[] | select(.meta.githubPrId == $PR) | .uid' deployments.json | head -n1)
          if [ -n "$DEP_ID" ] && [ "$DEP_ID" != "null" ]; then
            echo "id=$DEP_ID" >> $GITHUB_OUTPUT
          fi

      # Fallback: if we have preview host from details_url, match by .url
      - name: Fallback by preview host
        id: dep_by_host
        if: ${{ steps.from_check.outputs.id == '' && steps.from_check.outputs.host != '' && steps.dep_by_pr.outputs.id == '' }}
        run: |
          HOST="${{ steps.from_check.outputs.host }}"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT&target=preview&limit=50" > deployments.json
          DEP_ID=$(jq -r --arg HN "$HOST" '.deployments[] | select(.url == $HN) | .uid' deployments.json | head -n1)
          if [ -n "$DEP_ID" ] && [ "$DEP_ID" != "null" ]; then
            echo "id=$DEP_ID" >> $GITHUB_OUTPUT
          fi

      # Select final deployment id
      - name: Select deployment id
        id: sel
        run: |
          echo "id=${{ steps.from_check.outputs.id || steps.dep_by_pr.outputs.id || steps.dep_by_host.outputs.id }}" >> $GITHUB_OUTPUT

      # Fetch deployment events (build logs)
      - name: Fetch deployment events
        id: ev
        run: |
          DEP="${{ steps.sel.outputs.id }}"
          if [ -z "$DEP" ]; then
            echo "No deployment id resolved — nothing to fetch."; exit 1
          fi
          EV_URL="https://api.vercel.com/v2/deployments/${DEP}/events?teamId=${{ env.VERCEL_ORG }}&limit=1000"
          echo "GET $EV_URL"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "$EV_URL" > vercel-events.json
          echo "Events size: $(wc -c < vercel-events.json)"

      # Parse JSON → plaintext (tail + truncated full)
      - name: Parse logs
        id: logs
        run: |
          jq -r '
            def evs:
              if type=="array" then .
              elif has("events") then .events
              else [] end;
            evs
            | .[]
            | ( .payload? // .entry? // . )
            | ( .text?, .message?, .error?, .error?.message?, (.entries? // [])[]?, (.logs? // [])[]? )
            | strings
          ' vercel-events.json > vercel-build.log || true

          if [ -s vercel-build.log ]; then
            tail -n 200 vercel-build.log > tail.txt
            head -c 60000 vercel-build.log > full_truncated.txt
          else
            echo "[no events text returned by Vercel API]" > tail.txt
            cp tail.txt full_truncated.txt
          fi

      # Get deployment info (preview URL and readyState)
      - name: Deployment info
        id: info
        run: |
          DEP="${{ steps.sel.outputs.id }}"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${DEP}?teamId=${{ env.VERCEL_ORG }}" > vercel-deployment.json
          echo "url=$(jq -r '.url // empty' vercel-deployment.json)"   >> $GITHUB_OUTPUT
          echo "state=$(jq -r '.readyState // empty' vercel-deployment.json)" >> $GITHUB_OUTPUT

      # Put the tail into the job's Summary (visible in Checks → job → Summary)
      - name: Add job summary
        run: |
          echo "### Vercel Logs (tail 200)" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.info.outputs.url }}" ]; then
            echo "Preview: https://${{ steps.info.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat tail.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Create a dedicated check-run "Vercel Logs" attached to the resolved SHA
      - name: Publish check run (Vercel Logs)
        if: ${{ steps.ctx.outputs.sha != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            const sha  = '${{ steps.ctx.outputs.sha }}';
            const dep  = '${{ steps.sel.outputs.id }}';
            const state= '${{ steps.info.outputs.state }}';
            const url  = '${{ steps.info.outputs.url }}';
            const tail = fs.readFileSync('tail.txt','utf8');

            await github.rest.checks.create({
              owner, repo,
              name: 'Vercel Logs',
              head_sha: sha,
              status: 'completed',
              conclusion: (state === 'ERROR' ? 'failure' : 'neutral'),
              output: {
                title: `Vercel Logs (${state || 'unknown'})`,
                summary: `Deployment: ${dep}\n${url ? `Preview: https://${url}\n` : ''}\n\nLast 200 lines:\n\n\`\`\`\n${tail}\n\`\`\``
              }
            });

      # Build a rich PR comment (tail + collapsible full)
      - name: Build PR comment markdown
        if: ${{ steps.ctx.outputs.pr != '' }}
        run: |
          {
            echo "🔗 Deployment: \`${{ steps.sel.outputs.id }}\` — state: **${{ steps.info.outputs.state }}**"
            if [ -n "${{ steps.info.outputs.url }}" ]; then
              echo
              echo "Preview: https://${{ steps.info.outputs.url }}"
            fi
            echo
            echo "**Tail (200 lines):**"
            echo
            echo '```'
            cat tail.txt
            echo '```'
            echo
            echo "<details><summary>Show full log (truncated)</summary>"
            echo
            echo '```'
            cat full_truncated.txt
            echo '```'
            echo
            echo "</details>"
          } > comment.md

      - name: Comment to PR
        if: ${{ steps.ctx.outputs.pr != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.ctx.outputs.pr }}
          body-file: comment.md

      # Upload raw artifacts for debugging (optional)
      - name: Upload raw artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-raw
          path: |
            vercel-events.json
            vercel-deployment.json
            vercel-build.log
            tail.txt
            full_truncated.txt