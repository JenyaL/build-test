name: Fetch Vercel Logs

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull Request number (optional)"
        required: false
      sha:
        description: "Commit SHA (optional, overrides PR if set)"
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN:   ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG:     ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - uses: actions/checkout@v4

      # 1) Resolve PR/SHA
      - name: Resolve PR number and SHA
        id: ctx
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_INPUT="${{ github.event.inputs.pr }}"
          SHA_INPUT="${{ github.event.inputs.sha }}"

          if [ -n "$SHA_INPUT" ]; then
            echo "sha=$SHA_INPUT" >> $GITHUB_OUTPUT
          else
            if [ -n "$PR_INPUT" ]; then
              SHA=$(gh pr view "$PR_INPUT" --json headRefOid --jq .headRefOid)
              echo "sha=$SHA" >> $GITHUB_OUTPUT
              echo "pr=$PR_INPUT" >> $GITHUB_OUTPUT
            else
              PR=$(gh pr list --search "${{ github.sha }}" --json number --jq '.[0].number' || true)
              if [ -n "$PR" ] && [ "$PR" != "null" ]; then
                SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
                echo "pr=$PR"  >> $GITHUB_OUTPUT
                echo "sha=$SHA" >> $GITHUB_OUTPUT
              else
                echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      # 2) Find deployment (PR -> SHA -> latest preview)
      - name: Find Vercel deployment
        id: dep
        shell: bash
        run: |
          set -e
          test -n "$VERCEL_TOKEN"   || { echo "VERCEL_TOKEN is empty"; exit 1; }
          test -n "$VERCEL_PROJECT" || { echo "VERCEL_PROJECT_ID is empty"; exit 1; }
          test -n "$VERCEL_ORG"     || { echo "VERCEL_ORG_ID is empty"; exit 1; }

          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT&target=preview&limit=50" \
            > deployments.json

          DEP_ID=$(jq -r --arg PR "${{ steps.ctx.outputs.pr }}" \
            '.deployments[] | select(.meta.githubPrId == $PR) | .uid' deployments.json | head -n1)

          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            DEP_ID=$(jq -r --arg SHA "${{ steps.ctx.outputs.sha }}" \
              '.deployments[] | select(.meta.githubCommitSha == $SHA) | .uid' deployments.json | head -n1)
          fi

          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            DEP_ID=$(jq -r '.deployments[0].uid' deployments.json)
          fi

          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            echo "No deployment found (preview target)"; exit 1
          fi

          echo "id=$DEP_ID" >> $GITHUB_OUTPUT

      # 3) Try primary source: /v2/deployments/{id}/events
      - name: Fetch events JSON (primary)
        id: ev
        shell: bash
        run: |
          set -e
          URL="https://api.vercel.com/v2/deployments/${{ steps.dep.outputs.id }}/events?orgId=$VERCEL_ORG&limit=1000&since=0"
          echo "GET $URL"
          curl -sS -D headers-events.txt -o vercel-events.json \
            -H "Authorization: Bearer $VERCEL_TOKEN" "$URL" || true
          echo "---- /events HEADERS ----"; head -n 5 headers-events.txt || true
          echo "---- /events JSON HEAD (400) ----"; head -c 400 vercel-events.json || true; echo

      # 3b) If /events looks empty, try /builds and then /builds/{buildId}/events
      - name:
          Fallback: fetch builds & build events
        id: bld
        if: ${{ always() }}
        shell: bash
        run: |
          # Heuristic: treat /events as empty if file is zero-sized OR only has '[]' or '{"events":[]}'
          EMPTY="no"
          if [ ! -s vercel-events.json ]; then EMPTY="yes"; fi
          if grep -q '"events"\s*:\s*\[\s*\]' vercel-events.json 2>/dev/null; then EMPTY="yes"; fi

          if [ "$EMPTY" = "no" ]; then
            echo "skip_fallback=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Primary /events empty → trying /builds … /builds/{buildId}/events"

          # /v2/deployments/{id}/builds
          BURL="https://api.vercel.com/v2/deployments/${{ steps.dep.outputs.id }}/builds?orgId=$VERCEL_ORG"
          curl -sS -D headers-builds.txt -o vercel-builds.json \
            -H "Authorization: Bearer $VERCEL_TOKEN" "$BURL" || true
          echo "---- /builds HEADERS ----"; head -n 5 headers-builds.txt || true
          echo "---- /builds JSON HEAD (400) ----"; head -c 400 vercel-builds.json || true; echo

          # newest buildId
          BUILD_ID=$(jq -r '(.builds // .[])? | (.[0].id // .id // empty)' vercel-builds.json 2>/dev/null || true)
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "No buildId found in /builds"; exit 0
          fi
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

          # /v2/deployments/{id}/builds/{buildId}/events
          BEURL="https://api.vercel.com/v2/deployments/${{ steps.dep.outputs.id }}/builds/${BUILD_ID}/events?orgId=$VERCEL_ORG&limit=1000"
          curl -sS -D headers-build-events.txt -o vercel-build-events.json \
            -H "Authorization: Bearer $VERCEL_TOKEN" "$BEURL" || true
          echo "---- /builds/{id}/events HEADERS ----"; head -n 5 headers-build-events.txt || true
          echo "---- /builds/{id}/events JSON HEAD (400) ----"; head -c 400 vercel-build-events.json || true; echo

      # 4) Build plaintext log from whatever we got (events OR build-events)
      - name: Build plaintext log
        shell: bash
        run: |
          # Prefer the richer source:
          SRC="vercel-events.json"
          if [ -s vercel-build-events.json ]; then SRC="vercel-build-events.json"; fi

          # Extract strings from common fields; if empty, do recursive scan
          jq -r '
            ( .events // .builds // [] ) as $root
            | $root[]
            | (
                .payload? // .entry? // .
              ) |
              (
                .text?,
                .message?,
                .error?,
                .error?.message?,
                (.entries? // [])[]?,
                (.logs? // [])[]?
              )
              | strings
          ' "$SRC" > vercel-build.log 2>/dev/null || true

          if [ ! -s vercel-build.log ]; then
            # recursive fallback: print any scalar where path name includes text/message/error
            jq -r '
              paths(scalars) as $p
              | ( ($p|tostring) | test("text|message|error"; "i") )
              | select(.)
              | getpath($p)
              | tostring
            ' "$SRC" > vercel-build.log 2>/dev/null || true
          fi

          if [ ! -s vercel-build.log ]; then
            echo "[no known log fields found; dumping tail of raw JSON]" > vercel-build.log
            tail -c 1500 "$SRC" >> vercel-build.log || true
          fi

      # 5) Prepare markdown & summary (как в твоей текущей версии)
      - name: Prepare markdown (tail + collapsible full)
        id: md
        shell: bash
        run: |
          TAIL_LINES=200
          tail -n ${TAIL_LINES} vercel-build.log > tail.txt || true
          head -c 60000 vercel-build.log > full_truncated.txt || true

          {
            echo "<!-- vercel-logs-anchor -->"
            echo "❌ Vercel deployment \`${{ steps.dep.outputs.id }}\` failed (or produced logs)."
            echo
            echo "**Last ${TAIL_LINES} lines:**"
            echo
            echo '```'
            cat tail.txt 2>/dev/null || true
            echo '```'
            echo
            echo "<details><summary>Show truncated full log (~60k chars)</summary>"
            echo
            echo '```'
            cat full_truncated.txt 2>/dev/null || true
            echo '```'
            echo
            echo "</details>"
          } > comment.md

          {
            echo "### Vercel Logs (tail ${TAIL_LINES})"
            echo
            echo '```'
            cat tail.txt 2>/dev/null || true
            echo '```'
          } > summary.md

      - name: Add summary to PR Checks
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post/Update PR comment
        if: ${{ steps.ctx.outputs.pr != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.ctx.outputs.pr }}
          body-file: comment.md
          edit-mode: replace
          search: '<!-- vercel-logs-anchor -->'
          reactions: eyes

      # Keep raw responses to inspect if needed
      - name: Upload raw responses (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-raw
          path: |
            headers-events.txt
            vercel-events.json
            headers-builds.txt
            vercel-builds.json
            headers-build-events.txt
            vercel-build-events.json
            vercel-build.log
