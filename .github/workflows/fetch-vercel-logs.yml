name: Fetch Vercel Logs

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull Request number (optional)"
        required: false
      sha:
        description: "Commit SHA (optional, overrides PR if set)"
        required: false
      deployment_id:
        description: "Vercel deployment UID (dpl_*) — overrides PR/SHA"
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN:   ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG:     ${{ secrets.VERCEL_ORG_ID }}  # team_...

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure jq present
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

      - name: Validate required env
        shell: bash
        run: |
          set -e
          test -n "${VERCEL_TOKEN}"   || { echo "ERROR: VERCEL_TOKEN is empty (check repo Secrets)"; exit 1; }
          test -n "${VERCEL_PROJECT}" || { echo "ERROR: VERCEL_PROJECT_ID is empty (check repo Secrets)"; exit 1; }
          test -n "${VERCEL_ORG}"     || { echo "ERROR: VERCEL_ORG_ID (teamId) is empty (check repo Secrets)"; exit 1; }
          echo "VERCEL_TOKEN length: ${#VERCEL_TOKEN}"
          echo "VERCEL_PROJECT: ${VERCEL_PROJECT}"
          echo "VERCEL_ORG (teamId): ${VERCEL_ORG}"

      - name: Resolve PR number and SHA
        id: ctx
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_INPUT="${{ github.event.inputs.pr }}"
          SHA_INPUT="${{ github.event.inputs.sha }}"
          if [ -n "$SHA_INPUT" ]; then
            echo "sha=$SHA_INPUT" >> $GITHUB_OUTPUT
          else
            if [ -n "$PR_INPUT" ]; then
              SHA=$(gh pr view "$PR_INPUT" --json headRefOid --jq .headRefOid)
              echo "sha=$SHA" >> $GITHUB_OUTPUT
              echo "pr=$PR_INPUT" >> $GITHUB_OUTPUT
            else
              PR=$(gh pr list --search "${{ github.sha }}" --json number --jq '.[0].number' || true)
              if [ -n "$PR" ] && [ "$PR" != "null" ]; then
                SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
                echo "pr=$PR"  >> $GITHUB_OUTPUT
                echo "sha=$SHA" >> $GITHUB_OUTPUT
              else
                echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      - name: Use provided deployment_id if any
        id: dpl_input
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.deployment_id }}" ]; then
            echo "id=${{ github.event.inputs.deployment_id }}" >> $GITHUB_OUTPUT
          fi

      - name: Find Vercel deployment
        id: dep
        shell: bash
        run: |
          set -e
          if [ -n "${{ steps.dpl_input.outputs.id }}" ]; then
            echo "id=${{ steps.dpl_input.outputs.id }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # pull recent preview deployments
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT&target=preview&limit=50" \
            -w "\nHTTP_CODE:%{http_code}\n" -D dep_headers.txt -o deployments.json

          echo "First 200 chars of /v6 body:"; head -c 200 deployments.json || true; echo
          CODE=$(grep HTTP_CODE deployments.txt 2>/dev/null | cut -d: -f2) || true

          # Try to match PR → SHA → latest
          DEP_ID=$(jq -r --arg PR "${{ steps.ctx.outputs.pr }}" '.deployments[]? | select(.meta.githubPrId == $PR) | .uid' deployments.json | head -n1)
          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            DEP_ID=$(jq -r --arg SHA "${{ steps.ctx.outputs.sha }}" '.deployments[]? | select(.meta.githubCommitSha == $SHA) | .uid' deployments.json | head -n1)
          fi
          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            DEP_ID=$(jq -r '.deployments[0]?.uid' deployments.json)
          fi

          test -n "$DEP_ID" && [ "$DEP_ID" != "null" ] || { echo "ERROR: No deployment found"; exit 1; }
          echo "id=$DEP_ID" >> $GITHUB_OUTPUT
          echo "Using deployment: $DEP_ID"

      - name: Fetch deployment events (with HTTP code)
        id: ev
        shell: bash
        run: |
          set -e
          EV_URL="https://api.vercel.com/v2/deployments/${{ steps.dep.outputs.id }}/events?teamId=${{ env.VERCEL_ORG }}&limit=1000"
          echo "GET $EV_URL"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$EV_URL" \
            -w "\nHTTP_CODE:%{http_code}\n" \
            -D events_headers.txt \
            -o vercel-events.json || true

          echo "Events HTTP status:"
          head -n 1 events_headers.txt || true
          echo "Events file size (bytes): $(wc -c < vercel-events.json || echo 0)"
          echo "Events JSON head (400 chars):"
          head -c 400 vercel-events.json || true; echo

          CODE=$(tail -n 1 vercel-events.json | sed -n 's/HTTP_CODE://p')
          # Если тело пустое — CODE не вытащится; проверим отдельно
          if [ ! -s vercel-events.json ]; then
            echo "ERROR: vercel-events.json is empty. Check that secrets are valid and teamId is correct."
            exit 1
          fi

      - name: Parse logs from events
        id: logs
        shell: bash
        run: |
          jq -r '
            def evs:
              if type=="array" then .
              elif has("events") then .events
              else [] end;
            evs
            | .[]
            | ( .payload? // .entry? // . )
            | ( .text?, .message?, .error?, .error?.message?, (.entries? // [])[]?, (.logs? // [])[]? )
            | strings
          ' vercel-events.json > vercel-build.log || true

          if [ -s vercel-build.log ]; then
            echo "has_text=true" >> $GITHUB_OUTPUT
            echo "Sample tail:"
            tail -n 20 vercel-build.log || true
          else
            echo "No text lines extracted from events."
          fi

      - name: Deployment info
        id: info
        shell: bash
        run: |
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${{ steps.dep.outputs.id }}?teamId=${{ env.VERCEL_ORG }}" \
            -o vercel-deployment.json
          echo "url=$(jq -r '.url // empty' vercel-deployment.json)"   >> $GITHUB_OUTPUT
          echo "state=$(jq -r '.readyState // empty' vercel-deployment.json)" >> $GITHUB_OUTPUT

      - name: Prepare markdown
        id: md
        shell: bash
        run: |
          TAIL_LINES=200
          if [ -s vercel-build.log ]; then
            tail -n ${TAIL_LINES} vercel-build.log > tail.txt
          else
            echo "[no events text returned by Vercel API for this deployment]" > tail.txt
          fi

          DEP_ID="${{ steps.dep.outputs.id }}"
          DEP_URL="${{ steps.info.outputs.url }}"
          STATE="${{ steps.info.outputs.state }}"

          {
            echo "<!-- vercel-logs-anchor -->"
            echo "🔗 Deployment: \`$DEP_ID\` — state: **$STATE**"
            if [ -n "$DEP_URL" ]; then
              echo
              echo "Preview URL: https://$DEP_URL"
            fi
            echo
            echo "**Tail (${TAIL_LINES} lines):**"
            echo
            echo '```'
            cat tail.txt
            echo '```'
          } > comment.md

          {
            echo "### Vercel Logs (tail ${TAIL_LINES})"
            echo
            echo '```'
            cat tail.txt
            echo '```'
          } > summary.md

      - name: Add summary to PR Checks
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR comment
        if: ${{ steps.ctx.outputs.pr != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.ctx.outputs.pr }}
          body-file: comment.md
          edit-mode: replace
          search: '<!-- vercel-logs-anchor -->'
          reactions: eyes

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-raw
          path: |
            events_headers.txt
            vercel-events.json
            vercel-deployment.json
            vercel-build.log