name: Fetch Vercel Logs

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull Request number (optional)"
        required: false
      sha:
        description: "Commit SHA (optional, overrides PR if set)"
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN:   ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG:     ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - uses: actions/checkout@v4

      # 1) Resolve PR/SHA
      - name: Resolve PR number and SHA
        id: ctx
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_INPUT="${{ github.event.inputs.pr }}"
          SHA_INPUT="${{ github.event.inputs.sha }}"

          if [ -n "$SHA_INPUT" ]; then
            echo "sha=$SHA_INPUT" >> $GITHUB_OUTPUT
          else
            if [ -n "$PR_INPUT" ]; then
              SHA=$(gh pr view "$PR_INPUT" --json headRefOid --jq .headRefOid)
              echo "sha=$SHA" >> $GITHUB_OUTPUT
              echo "pr=$PR_INPUT" >> $GITHUB_OUTPUT
            else
              PR=$(gh pr list --search "${{ github.sha }}" --json number --jq '.[0].number' || true)
              if [ -n "$PR" ] && [ "$PR" != "null" ]; then
                SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
                echo "pr=$PR"  >> $GITHUB_OUTPUT
                echo "sha=$SHA" >> $GITHUB_OUTPUT
              else
                echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
              fi
            fi
          fi

      # 2) Find deployment (PR -> SHA -> latest preview)
      - name: Find Vercel deployment
        id: dep
        shell: bash
        run: |
          set -e
          test -n "$VERCEL_TOKEN"   || { echo "VERCEL_TOKEN is empty"; exit 1; }
          test -n "$VERCEL_PROJECT" || { echo "VERCEL_PROJECT_ID is empty"; exit 1; }
          test -n "$VERCEL_ORG"     || { echo "VERCEL_ORG_ID is empty"; exit 1; }

          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT&target=preview&limit=50" \
            > deployments.json

          DEP_ID=$(jq -r --arg PR "${{ steps.ctx.outputs.pr }}" \
            '.deployments[] | select(.meta.githubPrId == $PR) | .uid' deployments.json | head -n1)

          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            DEP_ID=$(jq -r --arg SHA "${{ steps.ctx.outputs.sha }}" \
              '.deployments[] | select(.meta.githubCommitSha == $SHA) | .uid' deployments.json | head -n1)
          fi

          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            DEP_ID=$(jq -r '.deployments[0].uid' deployments.json)
          fi

          if [ -z "$DEP_ID" ] || [ "$DEP_ID" = "null" ]; then
            echo "No deployment found (preview target)"; exit 1
          fi

          echo "id=$DEP_ID" >> $GITHUB_OUTPUT

      # 3) Fetch events JSON with debug
      - name: Fetch events JSON (debug)
        shell: bash
        run: |
          set -x
          BASE="https://api.vercel.com"
          DEP="${{ steps.dep.outputs.id }}"
          URL_EVENTS="$BASE/v2/deployments/$DEP/events?orgId=$VERCEL_ORG&limit=1000&direction=backward"
          # иногда помогает since=0
          URL_EVENTS_SINCE="$URL_EVENTS&since=0"

          # 1st try
          curl -sS -D headers1.txt -o vercel-events.json -H "Authorization: Bearer $VERCEL_TOKEN" "$URL_EVENTS" || true
          BYTES=$(wc -c < vercel-events.json | tr -d ' ')
          echo "events.json size: $BYTES bytes"
          echo "--- HEADERS #1 ---"; cat headers1.txt || true
          echo "--- JSON HEAD (first 400 chars) ---"; head -c 400 vercel-events.json || true; echo

          # If empty, 2nd try with since=0
          if [ "$BYTES" -lt 10 ]; then
            curl -sS -D headers2.txt -o vercel-events.json -H "Authorization: Bearer $VERCEL_TOKEN" "$URL_EVENTS_SINCE" || true
            echo "--- HEADERS #2 (since=0) ---"; cat headers2.txt || true
            echo "--- JSON HEAD (first 400 chars) ---"; head -c 400 vercel-events.json || true; echo
          fi

          # Save also basic deployment info (sometimes contains .error.message)
          curl -sS -D headers_dep.txt -o vercel-deployment.json -H "Authorization: Bearer $VERCEL_TOKEN" "$BASE/v13/deployments/$DEP?orgId=$VERCEL_ORG" || true
          echo "--- DEPLOYMENT HEADERS ---"; cat headers_dep.txt || true
          echo "--- DEPLOYMENT JSON HEAD (first 400 chars) ---"; head -c 400 vercel-deployment.json || true; echo

      # 4) Build plaintext log from whatever we got
      - name: Build plaintext log from JSONs
        shell: bash
        run: |
          # Try to extract as much human text as possible from events
          jq -r '
            .events? // [] |
            .[] |
            (
              .payload? // .
            ) |
            (
              .text?,
              .message?,
              .error?,
              .error?.message?,
              .entry?,
              (.entries? // [])[]?,
              (.logs? // [])[]?
            )
            | strings
          ' vercel-events.json > vercel-build.log || true

          # If still empty, fall back to deployment.error.message or raw tails
          if [ ! -s vercel-build.log ]; then
            jq -r '
              (
                .error?.message? // .error? // .readyState? // .state?
              ) // empty
            ' vercel-deployment.json > vercel-build.log || true
          fi

          if [ ! -s vercel-build.log ]; then
            echo "[no log lines; dumping tails]" > vercel-build.log
            echo "--- events tail ---" >> vercel-build.log
            tail -c 1500 vercel-events.json >> vercel-build.log || true
            echo -e "\n--- deployment tail ---" >> vercel-build.log
            tail -c 1500 vercel-deployment.json >> vercel-build.log || true
          fi

      # 5) Prepare markdown (tail + collapsible truncated full)
      - name: Prepare markdown
        id: md
        shell: bash
        run: |
          TAIL_LINES=200
          tail -n ${TAIL_LINES} vercel-build.log > tail.txt || true
          head -c 60000 vercel-build.log > full_truncated.txt || true

          {
            echo "<!-- vercel-logs-anchor -->"
            echo "❌ Vercel deployment \`${{ steps.dep.outputs.id }}\` failed (or produced logs)."
            echo
            echo "**Last ${TAIL_LINES} lines:**"
            echo
            echo '```'
            cat tail.txt 2>/dev/null || true
            echo '```'
            echo
            echo "<details><summary>Show truncated full log (~60k chars)</summary>"
            echo
            echo '```'
            cat full_truncated.txt 2>/dev/null || true
            echo '```'
            echo
            echo "</details>"
          } > comment.md

          {
            echo "### Vercel Logs (tail ${TAIL_LINES})"
            echo
            echo '```'
            cat tail.txt 2>/dev/null || true
            echo '```'
          } > summary.md

      # 6) Show tail in Checks summary
      - name: Add summary to PR Checks
        run: |
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      # 7) Post/update sticky PR comment
      - name: Post/Update PR comment
        if: ${{ steps.ctx.outputs.pr != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.ctx.outputs.pr }}
          body-file: comment.md
          edit-mode: replace
          search: '<!-- vercel-logs-anchor -->'
          reactions: eyes

      # 8) Attach raw files for debugging
      - name: Upload raw events and plaintext log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-events-and-log
          path: |
            vercel-events.json
            vercel-build.log
